  THESIS: BursaIQ is an enterprise capability exchange, not a chatbot surrounded by dashboards.
  OWN-WORLD: Deep Bursa navy navigation, pearl-blue work canvas, cobalt action, market-teal assurance, fine operational rules, and authored exchange-line geometry.
  STORY: Begin with one universal command, delegate work to a visible AI team, verify its output, then exchange the approved capability across Bursa.
  FIRST VIEWPORT: A dark 232px rail frames a light command centre: global search above, universal work composer and live mission brief in the main field, active agents and approvals in a narrow right rail.
  FORM EXEMPTION EVIDENCE: Code-led under new-work §3. The user pinned the six-destination information architecture, the Assistant migration, and a five-screen enterprise layout family, so a randomized concept roll would contradict the supplied direction.
  SIGNATURE: A traced handoff moves every mission through Research → Synthesis → Verification → Exchange; progress advances as a single left-to-right motion grammar.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
